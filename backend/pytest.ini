[pytest]
testpaths = tests
markers =
    live: 実際の Supabase を叩く（.env のキーが必要。`pytest -m live` で実行）
# ROS (launch_testing, ament_*) が PYTHONPATH に入っている PC で
# pytest プラグインとして読み込まれて失敗するのを防ぐ。他の環境では無害。
addopts =
    -m "not live"
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_copyright
    -p no:ament_pep257
    -p no:ament_flake8
    -p no:ament_lint
    -p no:ament_xmllint
